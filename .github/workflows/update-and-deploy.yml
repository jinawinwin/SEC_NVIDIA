name: Update SEC data & deploy dashboard

on:
  schedule:
    # 매월 1일·5일 09:00 KST (00:00 UTC) — 크롤링 → 분석 → 대시보드 재배포
    - cron: "0 0 1 * *"
    - cron: "0 0 5 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/update-and-deploy.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl SEC EDGAR
        env:
          # SEC requires a declared User-Agent with contact e-mail. Override with a repo secret if needed.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'SEC_NVIDIA Research starbucks@snu.ac.kr' }}
        run: python scripts/fetch_sec.py
      - name: Build datasets & dashboard data
        run: python scripts/build_dataset.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data README.md
          if git diff --cached --quiet; then
            echo "No new SEC data."
          else
            git commit -m "data: monthly SEC update $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
